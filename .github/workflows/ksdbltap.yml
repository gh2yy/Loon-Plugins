name: ksdbltap

on:
  workflow_dispatch:
  push:
    paths:
      - 'ksdbltap/**'
      - '.github/workflows/ksdbltap.yml'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build KSDblTapComment.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=13.0 \
            -framework Foundation \
            -fobjc-arc \
            -o KSDblTapComment.dylib \
            ksdbltap/KSDblTapComment.m
          file KSDblTapComment.dylib
          otool -L KSDblTapComment.dylib || true
      - name: Publish result branch
        run: |
          base64 -i KSDblTapComment.dylib -o KSDblTapComment.dylib.b64
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan results-ksdbltap
          git rm -rf . >/dev/null 2>&1 || true
          git add KSDblTapComment.dylib.b64
          git commit -m "KSDblTapComment.dylib build"
          git push -f origin results-ksdbltap
