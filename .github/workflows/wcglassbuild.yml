name: wcglassbuild
on:
  push:
    branches: [appicon-build]
permissions:
  contents: write
jobs:
  wcglassbuild:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build WCGlass dylib from repo source
        run: |
          set +e
          mkdir -p results
          sw_vers > results/toolchain.txt 2>&1
          xcodebuild -version >> results/toolchain.txt 2>&1
          ls -la WCGlass.m > results/src.log 2>&1
          md5 -q WCGlass.m >> results/src.log 2>&1
          echo "== clang dylib build" > results/clang.log
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -dynamiclib -install_name @executable_path/WCGlass.dylib -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -o WCGlass.dylib WCGlass.m >> results/clang.log 2>&1
          echo "clang exit: $?" >> results/clang.log
          file WCGlass.dylib >> results/clang.log 2>&1
          otool -L WCGlass.dylib >> results/clang.log 2>&1
          echo "mod_init sections:" >> results/clang.log 2>&1
          otool -l WCGlass.dylib | grep -A1 "__mod_init_func" >> results/clang.log 2>&1
          ls -la WCGlass.dylib >> results/clang.log 2>&1
          base64 -i WCGlass.dylib > results/WCGlass.dylib.b64.txt 2>&1
          cat results/toolchain.txt results/src.log results/clang.log > results/summary.txt
          cat results/summary.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B results-wcglassbuild
          git add results
          git commit -m "wcglassbuild results" || echo "nothing to commit"
          git push -f origin results-wcglassbuild
