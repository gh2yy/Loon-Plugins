name: hupuguard
on:
  push:
    branches: [appicon-build]
    paths: ['.github/workflows/hupuguard.yml', 'hupuguard/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hupuguard:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build HupuCrashGuard dylib
        run: |
          set +e
          mkdir -p results
          sw_vers > results/toolchain.txt 2>&1
          xcodebuild -version >> results/toolchain.txt 2>&1
          ls -la hupuguard/ > results/curl.log 2>&1
          head -5 hupuguard/HupuCrashGuard.c >> results/curl.log 2>&1
          echo "== clang dylib build" > results/clang.log
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -dynamiclib -install_name @executable_path/Frameworks/HupuCrashGuard.dylib -lobjc -o HupuCrashGuard.dylib hupuguard/HupuCrashGuard.c >> results/clang.log 2>&1
          echo "clang exit: $?" >> results/clang.log
          file HupuCrashGuard.dylib >> results/clang.log 2>&1
          otool -l HupuCrashGuard.dylib | grep -c "__interpose" >> results/clang.log 2>&1
          otool -L HupuCrashGuard.dylib >> results/clang.log 2>&1
          base64 -i HupuCrashGuard.dylib > results/HupuCrashGuard.dylib.b64.txt 2>&1
          cat results/toolchain.txt results/curl.log results/clang.log > results/summary.txt
          cat results/summary.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B results-hupuguard
          git add results
          git commit -m "hupuguard results" || echo "nothing to commit"
          git push -f origin results-hupuguard
